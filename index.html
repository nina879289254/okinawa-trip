<style>

    --indigo:#2B5C73; --indigo-ink:#173B4C;
    --moss:#4C6B41; --moss-bg:#E3EAD9;
    --turmeric:#B9812A; --turmeric-bg:#F6E4C1;
    --line:#D8CFB8; --line-strong:#C3B896;

      --indigo:#6FAFC9; --moss:#8FB37D; --moss-bg:#233227;

      --line:#33474E; --line-strong:#455860;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.65; font-size:15px; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0 0 8px; color:var(--ink);}
  .wrap{max-width:760px; margin:0 auto; padding:0 16px 70px;}
 
  header.hero{background:linear-gradient(180deg,#173B4C 0%,#2B5C73 100%); color:#F3ECDA; padding:22px 16px 18px;}
  header.hero .inner{max-width:760px; margin:0 auto;}
  header.hero h1{color:#FBF6E9; font-size:22px;}
  header.hero .sub{font-family:var(--font-mono); font-size:12px; color:#D9C9A8;}
  .guide-link{display:inline-block; margin-top:10px; font-family:var(--font-mono); font-size:12px; color:#FBF6E9; text-decoration:none; border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:5px 12px;}
  .guide-link:hover{background:rgba(255,255,255,.12);}
 
  nav.tabbar{position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line); padding-top:8px;}
  .tabbar-scroll{max-width:760px; margin:0 auto; display:flex; gap:6px; overflow-x:auto; padding:0 16px 8px; scrollbar-width:none;}
  .tabbar-scroll::-webkit-scrollbar{display:none;}
  .tab-btn{font-weight:700; font-size:13px; color:var(--ink-soft); background:transparent; border:1px solid transparent; padding:7px 13px; border-radius:999px; white-space:nowrap; cursor:pointer;}
  .tab-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
 
  section.panel{display:none; padding-top:18px;}
  section.panel.active{display:block;}
 
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;}
  .card h3{font-size:15px;}
  .today-banner{background:var(--coral); color:#FBF1E8; border-radius:var(--radius); padding:16px; margin-bottom:16px; font-weight:700;}
  .today-banner .small{font-weight:400; font-size:12.5px; opacity:.9; margin-top:4px; font-family:var(--font-mono);}
  .today-banner button{margin-top:10px; background:#fff; color:var(--coral-ink); border:none; border-radius:999px; padding:6px 14px; font-weight:700; cursor:pointer;}
 
  .day-mini{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px dashed var(--line); cursor:pointer;}
  .day-mini:last-child{border-bottom:none;}
  .day-mini .d{font-family:var(--font-mono); font-weight:700; font-size:12px; background:#173B4C; color:#F3ECDA; border-radius:7px; padding:4px 8px;}
  .day-mini.is-today .d{background:var(--coral); color:#fff;}
  .day-mini .t{flex:1; font-size:13.5px;}
 
  .day-card{background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:16px; overflow:hidden;}
  .day-card.is-today{border-color:var(--coral); box-shadow:0 0 0 2px var(--coral) inset;}
  .day-head{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; background:var(--card-alt);}
  .day-head .badge{font-family:var(--font-mono); font-weight:700; font-size:11px; background:var(--coral); color:#FBF1E8; padding:4px 9px; border-radius:7px;}
  .day-head .info{flex:1;}
  .day-head .ttl{font-weight:700; font-size:15px;}
  .day-head .date{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft);}
  .day-body{display:none; padding:8px 14px 14px;}
  .day-card.open .day-body{display:block;}
 
  .item-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}

  .item-row input.t-text{flex:1; font-size:13.5px;}
  .item-row input{border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--card); color:var(--ink); font-family:inherit;}
  .del-x{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; padding:2px 6px;}
  .add-row-btn, .add-line-btn{margin-top:6px; background:var(--card-alt); border:1px dashed var(--line-strong); color:var(--ink-soft); border-radius:8px; padding:7px 10px; font-size:12.5px; cursor:pointer; width:100%;}
 
  .backup-block{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .backup-block h4{font-size:12px; color:var(--turmeric); font-family:var(--font-mono); margin:0 0 6px;}
  .backup-item{display:flex; gap:6px; align-items:center; font-size:13px; margin-bottom:5px; background:var(--turmeric-bg); border-radius:8px; padding:5px 8px;}
  .backup-item span{flex:1;}
 
  .day-controls{display:flex; gap:8px; margin-bottom:14px;}
  .day-controls button{flex:1; background:var(--card); border:1px solid var(--line-strong); border-radius:10px; padding:9px; font-weight:700; font-size:13px; cursor:pointer; color:var(--ink);}
 
  /* expense tracker */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
  .form-grid.full{grid-template-columns:1fr;}
  .form-grid select, .form-grid input{border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--card); color:var(--ink); font-family:inherit; font-size:13.5px;}
  .add-expense-btn{width:100%; background:var(--coral); color:#fff; border:none; border-radius:10px; padding:10px; font-weight:700; cursor:pointer; margin-top:4px;}
  .expense-row{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .expense-row:last-child{border-bottom:none;}
  .expense-row .who{font-weight:700; min-width:52px; flex-shrink:0;}
  .expense-row .note{flex:1; min-width:140px;}
  .expense-row .amt{font-family:var(--font-mono); font-weight:700; color:var(--indigo); white-space:nowrap;}
  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .summary-card{background:var(--card-alt); border-radius:var(--radius); padding:12px; text-align:center;}
  .summary-card .num{font-family:var(--font-display); font-size:20px; color:var(--coral);}
  .summary-card .lbl{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .balance-line{background:var(--moss-bg); color:var(--moss); border-radius:10px; padding:10px 12px; font-weight:700; text-align:center; margin-bottom:14px; font-size:13.5px;}
  .fx-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
  .fx-row input{width:80px; border:1px solid var(--line); border-radius:8px; padding:5px 7px; background:var(--card); color:var(--ink); font-family:var(--font-mono);}
  .names-row{display:flex; gap:8px; margin-bottom:12px;}
  .names-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:7px 9px; background:var(--card); color:var(--ink); font-weight:700;}
 
  /* checklist */
  .progress-wrap{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:16px;}
  .progress-top{display:flex; justify-content:space-between; margin-bottom:6px;}
  .progress-top .pct{font-family:var(--font-display); font-size:19px; color:var(--coral);}
  .progress-bar{height:7px; background:var(--card-alt); border-radius:99px; overflow:hidden;}
  .progress-bar .fill{height:100%; background:var(--coral);}
  .check-group{margin-bottom:16px;}
  .check-group h4{font-size:12.5px; color:var(--ink-soft); font-family:var(--font-mono); text-transform:uppercase; margin-bottom:6px;}
  .check-item{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
  .check-item:last-child{border-bottom:none;}
  .check-item .box{width:18px; height:18px; border:2px solid var(--line-strong); border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .check-item.checked .box{background:var(--moss); border-color:var(--moss);}
  .check-item.checked .box:after{content:"✓"; color:#fff; font-size:11px; font-weight:700;}
  .check-item.checked .txt{color:var(--ink-soft); text-decoration:line-through;}
  .check-item .txt{flex:1; font-size:13px;}
 
  .sync-dot{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);}
  .sync-dot i{width:7px; height:7px; border-radius:50%; background:var(--moss); display:inline-block;}
  .sync-dot.off i{background:var(--coral);}
  .foot{text-align:center; color:var(--ink-soft); font-size:11px; font-family:var(--font-mono); margin-top:30px;}
</style>

<header class="hero">
  <div class="inner">
    <h1>沖繩旅遊 App</h1>
    <div class="sub" id="dateRangeLabel">2026.10.01 — 10.06</div>
    <a class="guide-link" href="guide.html" target="_blank" rel="noopener">📖 完整參考手冊（住宿／美食／景點／伴手禮）</a>
  </div>
</header>
 
<nav class="tabbar">
  <div class="tabbar-scroll" id="tabbar">
    <button class="tab-btn active" data-tab="overview">總覽</button>
    <button class="tab-btn" data-tab="itinerary">行程</button>
    <button class="tab-btn" data-tab="expense">記帳</button>
    <button class="tab-btn" data-tab="prep">行前準備</button>
  </div>
</nav>
 
<div class="wrap">
 
  <section class="panel active" id="panel-overview">
    <div id="todayBannerHolder"></div>
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <span class="sync-dot" id="syncDot"><i></i> <span id="syncText">連線中...</span></span>
    </div>
    <div class="card" style="padding:4px 12px;" id="dayMiniList"></div>
  </section>
 
  <section class="panel" id="panel-itinerary">
    <div class="day-controls">
      <button id="addDayBtn">＋ 新增一天</button>
    </div>
    <div id="dayCardsHolder"></div>
  </section>
 
  <section class="panel" id="panel-expense">
    <div class="card">
      <h3>付款人姓名</h3>
      <div class="names-row">
        <input id="personA" placeholder="人物A姓名">
        <input id="personB" placeholder="人物B姓名">
      </div>
      <div class="fx-row">
        匯率 1 JPY = <input id="fxRate" type="number" step="0.001"> TWD
        <button id="saveFxBtn" style="margin-left:auto; font-size:11px; padding:4px 10px; border-radius:8px; border:1px solid var(--line-strong); background:var(--card-alt); cursor:pointer;">儲存</button>
      </div>
    </div>
 
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="balance-line" id="balanceLine"></div>
 
    <div class="card">
      <h3>新增一筆花費</h3>
      <div class="form-grid">
        <select id="expWho"></select>
        <select id="expCategory"></select>
      </div>
      <div class="form-grid">
        <input id="expAmount" type="number" placeholder="金額">
        <select id="expCurrency"><option value="JPY">日圓 JPY</option><option value="TWD">台幣 TWD</option></select>
      </div>
      <div class="form-grid full">
        <input id="expNote" placeholder="備註，例如：壽喜燒晚餐">
      </div>
      <div class="form-grid full">
        <select id="expSplitType">
          <option value="even">平分（各一半）</option>
          <option value="allA">全部算她的（不用分攤）</option>
          <option value="allB">全部算他的（不用分攤）</option>
          <option value="custom">自訂比例</option>
        </select>
      </div>
      <div class="form-grid" id="customSplitRow" style="display:none;">
        <input id="expSplitPctA" type="number" min="0" max="100" placeholder="她的%數，例如70">
        <div style="display:flex; align-items:center; font-size:12.5px; color:var(--ink-soft);" id="customSplitBLabel">他佔 30%</div>
      </div>
      <button class="add-expense-btn" id="addExpenseBtn">＋ 新增花費</button>
    </div>
 
    <div class="card">
      <h3>所有花費紀錄</h3>
      <div id="expenseList"></div>
    </div>
  </section>
 
  <section class="panel" id="panel-prep">
    <div class="progress-wrap">
      <div class="progress-top"><div>整體進度</div><div class="pct" id="pct">0%</div></div>
      <div class="progress-bar"><div class="fill" id="fill" style="width:0%"></div></div>
    </div>
    <div id="checklistHolder"></div>
  </section>
 
  <div class="foot">沖繩旅遊 App · 雙人同步版</div>
</div>

    {id:"res1", group:"訂位提醒", text:"お肉の一心（Day1晚餐，須前一天訂位）", checked:false},
    {id:"res2", group:"訂位提醒", text:"Buchi Kumojiten（Day4晚餐，IG私訊訂位）", checked:false},
    {id:"res3", group:"訂位提醒", text:"百年古家大家（Day2晚餐，建議預約）", checked:false},
    {id:"res4", group:"訂位提醒", text:"確認四間住宿都已訂房", checked:false},
    {id:"net1", group:"通訊・金錢", text:"日本上網SIM卡或eSIM", checked:false},
    {id:"net2", group:"通訊・金錢", text:"兌換日圓現金（每人2~3萬円）", checked:false},
    {id:"net3", group:"通訊・金錢", text:"OKICA交通系IC卡", checked:false},
    {id:"bag1", group:"行李裝備", text:"泳衣・浮潛快乾衣物", checked:false},
    {id:"bag2", group:"行李裝備", text:"防曬乳・曬後保養", checked:false},
    {id:"bag3", group:"行李裝備", text:"好走的鞋", checked:false},
    {id:"bag4", group:"行李裝備", text:"輕便雨衣／薄外套", checked:false},
    {id:"pc1", group:"個人與3C", text:"常備藥品", checked:false},
    {id:"pc2", group:"個人與3C", text:"行動電源＋充電線", checked:false},
    {id:"pc3", group:"個人與3C", text:"防水手機袋、夾鏈袋", checked:false}
  ]
};
 
let state = null;
 
/* ====================== REALTIME SYNC ====================== */
const syncDot = document.getElementById('syncDot');
const syncText = document.getElementById('syncText');
 
tripRef.onSnapshot(function(doc){
  if(doc.exists){
    state = doc.data();
  } else {
    state = SEED;
    tripRef.set(SEED);
  }
  syncDot.classList.remove('off');
  syncText.textContent = '已同步';
  renderAll();
}, function(err){
  syncDot.classList.add('off');
  syncText.textContent = '連線失敗（檢查網路或Firestore規則）';
  console.error(err);
});
 
function saveState(){
  tripRef.set(state).catch(function(e){ console.error('save failed', e); });
}
 
/* ====================== TAB SWITCHING ====================== */
document.getElementById('tabbar').addEventListener('click', function(e){
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
});
 
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+name));
}
 
/* ====================== DATE HELPERS ====================== */
function todayStr(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function findTodayDay(){
  if(!state) return null;
  const t = todayStr();
  return state.days.find(function(d){ return d.date === t; }) || null;
}
 
/* ====================== RENDER: OVERVIEW ====================== */
function renderOverview(){
  const holder = document.getElementById('todayBannerHolder');
  const today = findTodayDay();
  const t = todayStr();
  if(today){
    holder.innerHTML =
      '<div class="today-banner">🎉 今天是 ' + today.badge + '：' + today.title +
      '<div class="small">' + today.date + '</div>' +
      '<button onclick="jumpToDay(' + today.id + ')">查看今天的行程 →</button></div>';
  } else if(state.days.length && t < state.days[0].date){
    const diff = Math.ceil((new Date(state.days[0].date) - new Date(t)) / 86400000);
    holder.innerHTML = '<div class="today-banner" style="background:var(--indigo);">距離出發還有 ' + diff + ' 天</div>';
  } else if(state.days.length && t > state.days[state.days.length-1].date){
    holder.innerHTML = '<div class="today-banner" style="background:var(--moss);">旅程已結束，希望這趟玩得開心 🌺</div>';
  } else {
    holder.innerHTML = '';
  }
 
  const list = document.getElementById('dayMiniList');
  list.innerHTML = state.days.map(function(d){
    const isToday = today && today.id === d.id;
    return '<div class="day-mini' + (isToday?' is-today':'') + '" onclick="jumpToDay(' + d.id + ')">' +
      '<div class="d">D' + d.id + '</div><div class="t">' + escapeHtml(d.title) + '</div></div>';
  }).join('');
}
 
function jumpToDay(id){
  switchTab('itinerary');
  document.querySelectorAll('.day-card').forEach(function(c){ c.classList.remove('open'); });
  const el = document.getElementById('day-' + id);
  if(el){ el.classList.add('open'); setTimeout(function(){ el.scrollIntoView({behavior:'smooth', block:'start'}); }, 50); }
  window.scrollTo({top:0, behavior:'auto'});
}
 
/* ====================== RENDER: ITINERARY ====================== */
function renderItinerary(){
  const holder = document.getElementById('dayCardsHolder');
  const today = findTodayDay();
  holder.innerHTML = state.days.map(function(d){
    const isToday = today && today.id === d.id;
    const itemsHtml = d.items.map(function(it, idx){
      return '<div class="item-row">' +
        '<input class="t-time" value="' + escapeAttr(it.time) + '" onchange="updateItem(' + d.id + ',' + idx + ',\'time\',this.value)">' +
        '<input class="t-text" value="' + escapeAttr(it.text) + '" onchange="updateItem(' + d.id + ',' + idx + ',\'text\',this.value)">' +
        '<button class="del-x" onclick="deleteItem(' + d.id + ',' + idx + ')">✕</button>' +
        '</div>';
    }).join('');
    const backupsHtml = d.backups.map(function(b, idx){
      return '<div class="backup-item"><span>' + escapeHtml(b) + '</span><button class="del-x" onclick="deleteBackup(' + d.id + ',' + idx + ')">✕</button></div>';
    }).join('');
    return '<div class="day-card' + (isToday?' open is-today':'') + '" id="day-' + d.id + '">' +
      '<div class="day-head" onclick="toggleDay(' + d.id + ')">' +
        '<div class="badge">' + d.badge + '</div>' +
        '<div class="info"><input class="ttl-input" style="border:none;background:none;font-weight:700;font-size:15px;color:inherit;width:100%;padding:0;" value="' + escapeAttr(d.title) + '" onclick="event.stopPropagation()" onchange="updateDayTitle(' + d.id + ', this.value)">' +
        '<div class="date-row" style="display:flex;gap:6px;align-items:center;"><input type="date" value="' + d.date + '" onclick="event.stopPropagation()" onchange="updateDayDate(' + d.id + ', this.value)" style="font-family:var(--font-mono);font-size:11px;border:none;background:none;color:var(--ink-soft);"></div></div>' +
        '<button class="del-x" onclick="event.stopPropagation(); deleteDay(' + d.id + ')" title="刪除這一天">🗑</button>' +
      '</div>' +
      '<div class="day-body">' +
        itemsHtml +
        '<button class="add-line-btn" onclick="addItem(' + d.id + ')">＋ 新增一個行程項目</button>' +
        '<div class="backup-block"><h4>備案清單</h4>' + backupsHtml +
        '<button class="add-row-btn" onclick="addBackup(' + d.id + ')">＋ 新增備案</button></div>' +
      '</div>' +
    '</div>';
  }).join('');
}
 
function toggleDay(id){
  const el = document.getElementById('day-' + id);
  if(el) el.classList.toggle('open');
}
function getDay(id){ return state.days.find(function(d){ return d.id === id; }); }
 
function updateItem(dayId, idx, field, value){
  const d = getDay(dayId); d.items[idx][field] = value; saveState();
}
function deleteItem(dayId, idx){
  const d = getDay(dayId); d.items.splice(idx,1); saveState(); renderItinerary();
}
function addItem(dayId){
  const d = getDay(dayId); d.items.push({time:'', text:''}); saveState(); renderItinerary();
  const el = document.getElementById('day-' + dayId); if(el) el.classList.add('open');
}
function updateDayTitle(dayId, value){ getDay(dayId).title = value; saveState(); }
function updateDayDate(dayId, value){ getDay(dayId).date = value; saveState(); renderOverview(); }
function deleteDay(dayId){
  if(!confirm('確定要刪除這一天嗎？')) return;
  state.days = state.days.filter(function(d){ return d.id !== dayId; });
  saveState(); renderAll();
}
function addDay(){
  const maxId = state.days.reduce(function(m,d){ return Math.max(m,d.id); }, 0);
  state.days.push({ id:maxId+1, date:todayStr(), badge:'DAY ' + String(maxId+1).padStart(2,'0'), title:'新的一天', items:[], backups:[] });
  saveState(); renderAll();
}
function addBackup(dayId){
  const v = prompt('輸入備案內容（例如：客滿時改去哪家店）：');
  if(!v) return;
  const d = getDay(dayId); d.backups.push(v); saveState(); renderItinerary();
}
function deleteBackup(dayId, idx){
  const d = getDay(dayId); d.backups.splice(idx,1); saveState(); renderItinerary();
}
document.getElementById('addDayBtn').addEventListener('click', addDay);
 
/* ====================== RENDER: EXPENSE TRACKER ====================== */
function expCategoryOptions(){
  const opts = [{id:'prep', label:'行前準備'}];
  state.days.forEach(function(d){ opts.push({id:'day'+d.id, label:'Day'+d.id+' '+d.title}); });
  opts.push({id:'other', label:'其他'});
  return opts;
}
function categoryLabel(catId){
  const found = expCategoryOptions().find(function(o){ return o.id===catId; });
  if(found) return found.label;
  if(catId && catId.indexOf('day')===0) return 'Day' + catId.slice(3) + '（已刪除）';
  return '其他';
}
// backward-compatible getters: older entries used {who, day} with implicit even split
function getPaidBy(e){ return e.paidBy != null ? e.paidBy : e.who; }
function getCategory(e){ return e.category != null ? e.category : ('day' + (e.day || '')); }
function getSplitA(e){ return e.splitA != null ? e.splitA : 0.5; }
 
function renderExpense(){
  document.getElementById('personA').value = state.meta.personA;
  document.getElementById('personB').value = state.meta.personB;
  document.getElementById('fxRate').value = state.fxRate;
 
  const expWho = document.getElementById('expWho');
  expWho.innerHTML = '<option value="'+escapeAttr(state.meta.personA)+'">'+escapeHtml(state.meta.personA)+'</option><option value="'+escapeAttr(state.meta.personB)+'">'+escapeHtml(state.meta.personB)+'</option>';
 
  const expCategory = document.getElementById('expCategory');
  expCategory.innerHTML = expCategoryOptions().map(function(o){ return '<option value="'+o.id+'">'+escapeHtml(o.label)+'</option>'; }).join('');
 
  function toTWD(exp){ return exp.currency === 'JPY' ? exp.amount * state.fxRate : exp.amount; }
 
  let paidA=0, paidB=0, shareA=0, shareB=0;
  state.expenses.forEach(function(e){
    const twd = toTWD(e);
    const sA = getSplitA(e);
    const payer = getPaidBy(e);
    if(payer === state.meta.personA) paidA += twd;
    else if(payer === state.meta.personB) paidB += twd;
    shareA += twd * sA;
    shareB += twd * (1 - sA);
  });
  const total = paidA + paidB;
 
  document.getElementById('summaryGrid').innerHTML =
    '<div class="summary-card"><div class="num">NT$'+Math.round(paidA)+'</div><div class="lbl">'+escapeHtml(state.meta.personA)+' 已付出<br>應負擔 NT$'+Math.round(shareA)+'</div></div>' +
    '<div class="summary-card"><div class="num">NT$'+Math.round(paidB)+'</div><div class="lbl">'+escapeHtml(state.meta.personB)+' 已付出<br>應負擔 NT$'+Math.round(shareB)+'</div></div>';
 
  const netA = paidA - shareA; // >0 表示A多付了，B該轉給A
  let balanceMsg;
  if(Math.abs(netA) < 1){ balanceMsg = '目前兩人帳務打平 🎉'; }
  else if(netA > 0){ balanceMsg = escapeHtml(state.meta.personB) + ' 該轉給 ' + escapeHtml(state.meta.personA) + ' NT$' + Math.round(netA); }
  else { balanceMsg = escapeHtml(state.meta.personA) + ' 該轉給 ' + escapeHtml(state.meta.personB) + ' NT$' + Math.round(-netA); }
  document.getElementById('balanceLine').textContent = balanceMsg + '（總花費 NT$' + Math.round(total) + '，已依每筆設定的分攤比例計算）';
 
  const list = document.getElementById('expenseList');
  if(!state.expenses.length){
    list.innerHTML = '<div style="color:var(--ink-soft); font-size:13px;">還沒有任何紀錄，新增第一筆花費吧！</div>';
  } else {
    list.innerHTML = state.expenses.slice().reverse().map(function(e){
      const twd = Math.round(toTWD(e));
      const sA = getSplitA(e);
      let splitLabel;
      if(sA === 1){ splitLabel = '全算'+escapeHtml(state.meta.personA); }
      else if(sA === 0){ splitLabel = '全算'+escapeHtml(state.meta.personB); }
      else if(sA === 0.5){ splitLabel = '平分'; }
      else { splitLabel = escapeHtml(state.meta.personA)+' '+Math.round(sA*100)+'% / '+escapeHtml(state.meta.personB)+' '+Math.round((1-sA)*100)+'%'; }
      return '<div class="expense-row" style="flex-wrap:wrap;">' +
        '<div class="who">'+escapeHtml(getPaidBy(e))+'付</div>' +
        '<div class="note">'+escapeHtml(categoryLabel(getCategory(e)))+' · '+escapeHtml(e.note||'')+'<br><span style="font-size:11px;color:var(--ink-soft);">分攤：'+splitLabel+'</span></div>' +
        '<div class="amt">'+e.amount+' '+e.currency+' <span style="color:var(--ink-soft);font-weight:400;">(≈NT$'+twd+')</span></div>' +
        '<button class="del-x" onclick="deleteExpense(\''+e.id+'\')">✕</button>' +
      '</div>';
    }).join('');
  }
}
 
function deleteExpense(id){
  state.expenses = state.expenses.filter(function(e){ return e.id !== id; });
  saveState(); renderExpense();
}
 
const splitTypeSelect = document.getElementById('expSplitType');
const customSplitRow = document.getElementById('customSplitRow');
const splitPctA = document.getElementById('expSplitPctA');
const splitBLabel = document.getElementById('customSplitBLabel');
splitTypeSelect.addEventListener('change', function(){
  customSplitRow.style.display = (splitTypeSelect.value === 'custom') ? 'flex' : 'none';
});
splitPctA.addEventListener('input', function(){
  const v = Math.max(0, Math.min(100, parseFloat(splitPctA.value) || 0));
  splitBLabel.textContent = '他佔 ' + (100 - v) + '%';
});
 
document.getElementById('addExpenseBtn').addEventListener('click', function(){
  const paidBy = document.getElementById('expWho').value;
  const category = document.getElementById('expCategory').value;
  const amount = parseFloat(document.getElementById('expAmount').value);
  const currency = document.getElementById('expCurrency').value;
  const note = document.getElementById('expNote').value;
  const splitType = splitTypeSelect.value;
  let splitA;
  if(splitType === 'even') splitA = 0.5;
  else if(splitType === 'allA') splitA = 1;
  else if(splitType === 'allB') splitA = 0;
  else { splitA = Math.max(0, Math.min(100, parseFloat(splitPctA.value) || 0)) / 100; }
 
  if(!amount || amount <= 0){ alert('請輸入正確的金額'); return; }
  state.expenses.push({ id:'e'+Date.now(), paidBy:paidBy, category:category, amount:amount, currency:currency, note:note, splitA:splitA });
  saveState();
  document.getElementById('expAmount').value = '';
  document.getElementById('expNote').value = '';
  renderExpense();
});
document.getElementById('saveFxBtn').addEventListener('click', function(){
  const v = parseFloat(document.getElementById('fxRate').value);
  if(v > 0){ state.fxRate = v; saveState(); renderExpense(); }
});
document.getElementById('personA').addEventListener('change', function(e){ state.meta.personA = e.target.value || 'Nina'; saveState(); renderExpense(); });
document.getElementById('personB').addEventListener('change', function(e){ state.meta.personB = e.target.value || '男友'; saveState(); renderExpense(); });
 
/* ====================== RENDER: CHECKLIST ====================== */
function renderChecklist(){
  const groups = {};
  state.checklist.forEach(function(item){
    if(!groups[item.group]) groups[item.group] = [];
    groups[item.group].push(item);
  });
  const holder = document.getElementById('checklistHolder');
  holder.innerHTML = Object.keys(groups).map(function(g){
    return '<div class="check-group"><h4>'+escapeHtml(g)+'</h4>' +
      groups[g].map(function(item){
        return '<div class="check-item' + (item.checked?' checked':'') + '" onclick="toggleCheck(\''+item.id+'\')">' +
          '<div class="box"></div><div class="txt">'+escapeHtml(item.text)+'</div></div>';
      }).join('') + '</div>';
  }).join('');
  updateProgress();
}
function toggleCheck(id){
  const item = state.checklist.find(function(i){ return i.id===id; });
  item.checked = !item.checked;
  saveState(); renderChecklist();
}
function updateProgress(){
  const total = state.checklist.length;
  const done = state.checklist.filter(function(i){ return i.checked; }).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('fill').style.width = pct + '%';
}
 
/* ====================== UTIL ====================== */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function escapeAttr(s){ return escapeHtml(s); }
 
function renderAll(){
  if(!state) return;
  renderOverview();
  renderItinerary();
  renderExpense();
  renderChecklist();
}
</script>
